<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BLIND SPOT — visual prototype</title>
    <style>
      /* The void is absolute (visual-brief §1.7). Nothing here may imply space. */
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #9fe; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; inset: 0; pointer-events: none; }
      #overlay { position: fixed; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #6fd; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
        background: #000; z-index: 20;
      }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="overlay"></div>
    <div id="boot">baking lattice…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
