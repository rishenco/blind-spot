<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>BLIND SPOT</title>
<style>
  :root { --amber:#ffb347; --cyan:#5ce1e6; --dim:#5a6a7a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color:#cfe3f0; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  .hud { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #crosshair { position:absolute; left:50%; top:50%; width:18px; height:18px;
    transform:translate(-50%,-50%); opacity:.75; }
  #crosshair:before, #crosshair:after { content:''; position:absolute; background:var(--cyan); }
  #crosshair:before { left:50%; top:0; width:1px; height:100%; transform:translateX(-50%); }
  #crosshair:after { top:50%; left:0; height:1px; width:100%; transform:translateY(-50%); }
  #stats { position:absolute; left:14px; top:12px; font-size:11px; line-height:1.6;
    color:var(--dim); letter-spacing:.06em; }
  #stats b { color:var(--cyan); font-weight:400; }
  #center { position:fixed; inset:0; display:grid; place-items:center; z-index:20;
    background:radial-gradient(ellipse at center, rgba(8,14,20,.86), rgba(0,0,0,.97)); }
  #center .card { text-align:center; max-width:460px; padding:28px 34px; }
  #center h1 { font-size:34px; letter-spacing:.42em; font-weight:400; color:#e8f4ff;
    text-shadow:0 0 24px rgba(92,225,230,.45); margin-bottom:6px; }
  #center .sub { color:var(--amber); font-size:11px; letter-spacing:.3em; margin-bottom:22px; }
  #center p { color:var(--dim); font-size:12px; line-height:2; }
  #center kbd { color:var(--cyan); }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div id="crosshair"></div>
    <div id="stats"></div>
  </div>
  <div id="center"><div class="card">
    <h1>BLIND SPOT</h1>
    <div class="sub">SUBSTATION 7</div>
    <p>
      <kbd>CLICK</kbd> to take control<br/>
      <kbd>WASD</kbd> move &nbsp;·&nbsp; <kbd>SHIFT</kbd> sprint &nbsp;·&nbsp; <kbd>CTRL</kbd> crouch<br/>
      <kbd>LMB</kbd> pulse &nbsp;·&nbsp; <kbd>ESC</kbd> release
    </p>
  </div></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
