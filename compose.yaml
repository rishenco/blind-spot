services:
  # Production-style test server: builds the bundle in the image, serves it static.
  #   docker compose up --build        -> http://localhost:8080
  game:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Live-reload dev server against the working tree (no image rebuild per change):
  #   docker compose --profile dev up dev   -> http://localhost:5173
  # node_modules lives in a named volume so the container never fights the host's.
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  dev_node_modules:
